name: "Task"
description: A well-defined piece of engineering work (refactor, chore, tech debt, internal tooling).
type: task
labels: ["status:needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: Why does this matter now? Link related issues, PRs, or discussions.
    validations:
      required: false
