name: "Tracking Issue"
description: Track progress of a larger effort spanning multiple issues or PRs (an epic).
type: tracking
title: "<title>"
labels: ["status:needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: "Goal / Summary"
      description: What is this effort trying to achieve, and why?
    validations:
      required: true

  - type: textarea
    id: sub-issues
    attributes:
      label: "Sub-issues"
      description: List the issues/PRs that make up this effort, one per line.
      value: |
        - [ ] #
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: "Success Criteria"
      description: How do we know this effort is complete?
    validations:
      required: false
